<div class="login-container">
  <div class="login-card glass-panel">
    <div class="login-header">
      <h2>Welcome back</h2>
      <p>Enter your credentials to access your account</p>
    </div>

    <form class="login-form" (ngSubmit)="onLogin()">
      <div class="form-group">
        <label class="input-label" for="email">Email</label>
        <input type="email" id="email" name="email" [(ngModel)]="email" class="input-field" placeholder="name@company.com" required>
      </div>
      
      <div class="form-group">
        <label class="input-label" for="password">Password</label>
        <input type="password" id="password" name="password" [(ngModel)]="password" class="input-field" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-primary w-full" [disabled]="isLoading">
        {{ isLoading ? 'Signing in…' : 'Sign In' }}
      </button>
    </form>
  </div>
</div>
